[package]
name = "lumo-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
nix = { version = "0.30", features = ["poll"] }
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["wayland", "x11"] }
smithay-client-toolkit = "0.19"
tiny-skia = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
lumo-ipc = { path = "../crates/compositor/lumo-ipc" }
lumo-foundation = { path = "../crates/foundation/lumo-foundation" }
lumo-animation = { path = "../crates/graphics/lumo-animation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api"] }
cosmic-text = "0.12"
fontdb = "0.18"

# Refactor A-REFACTOR: expoe lib crate `lumo_shell` consumida pelos bins.
# bar/desktop foram quebrados em modulos por feature (memory
# feedback_lumo_arquitetura_clean).
[lib]
name = "lumo_shell"
path = "src/lib.rs"

[[bin]]
name = "lumo-shell"
path = "src/main.rs"

[[bin]]
name = "lumo-bar"
path = "src/bin/lumo-bar.rs"

[[bin]]
name = "lumo-desktop"
path = "src/bin/lumo-desktop.rs"
