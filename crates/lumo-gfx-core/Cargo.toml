[package]
name = "lumo-gfx-core"
version = "0.1.0"
edition = "2021"
description = "Lumo GFX umbrella: re-exporta foundation + beam + graphics + text + animation + input + kit. Mantem um ponto unico de teste (bins demo)."

[lib]
path = "src/lib.rs"

[dependencies]
wgpu = "23"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
cosmic-text = "0.12"
lumo-foundation = { path = "../foundation/lumo-foundation" }
lumo-beam = { path = "../graphics/lumo-beam" }
lumo-graphics = { path = "../graphics/lumo-graphics" }
lumo-text = { path = "../graphics/lumo-text" }
lumo-animation = { path = "../graphics/lumo-animation" }
lumo-input = { path = "../ui/lumo-input" }
lumo-kit = { path = "../ui/lumo-kit" }

[[bin]]
name = "triangle"
path = "src/bin/triangle.rs"

[[bin]]
name = "quad-gallery"
path = "src/bin/quad-gallery.rs"

[[bin]]
name = "text-demo"
path = "src/bin/text-demo.rs"

[[bin]]
name = "quad-shadow"
path = "src/bin/quad-shadow.rs"

[[bin]]
name = "button-demo"
path = "src/bin/button-demo.rs"

[[bin]]
name = "button-interactive"
path = "src/bin/button-interactive.rs"
