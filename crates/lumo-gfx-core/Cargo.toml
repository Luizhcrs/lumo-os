[package]
name = "lumo-gfx-core"
version = "0.1.0"
edition = "2021"
description = "Lumo GFX core - wgpu-backed graphics primitives for Lumo OS Layer 4.1+"

[lib]
path = "src/lib.rs"

[[bin]]
name = "triangle"
path = "src/bin/triangle.rs"

[[bin]]
name = "quad-gallery"
path = "src/bin/quad-gallery.rs"

[dependencies]
wgpu = "23"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "text-demo"
path = "src/bin/text-demo.rs"

[dependencies.cosmic-text]
version = "0.12"

[dependencies.etagere]
version = "0.2"

[[bin]]
name = "quad-shadow"
path = "src/bin/quad-shadow.rs"

[[bin]]
name = "button-demo"
path = "src/bin/button-demo.rs"

[[bin]]
name = "button-interactive"
path = "src/bin/button-interactive.rs"
