[package]
name = "lumo-telemetry"
version = "0.1.0"
edition = "2021"
description = "Lumo OS full-stack telemetry: events, histograms, unix socket exporter."

[lib]
path = "src/lib.rs"

[dependencies]
hdrhistogram = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
