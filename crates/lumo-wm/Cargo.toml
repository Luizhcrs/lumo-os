[package]
name = "lumo-wm"
version = "0.1.0"
edition = "2021"
description = "Lumo WM - Smithay-based Wayland compositor for Lumo OS Layer 5"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lumo-wm"
path = "src/bin/lumo-wm.rs"

[dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "wayland_frontend",
    "renderer_gl",
    "desktop",
] }
calloop = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
