[package]
name = "lumo-wm"
version = "0.1.0"
edition = "2021"
description = "Lumo WM - Smithay-based Wayland compositor for Lumo OS Layer 5"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lumo-wm"
path = "src/bin/lumo-wm.rs"

[features]
default = []
# Backend DRM/KMS (TTY direto, fullscreen). Opt-in pra nao
# pesar build padrao (winit-only); precisa de libseat,
# libinput, libudev no sistema.
drm-backend = [
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_session_libseat",
    "smithay/backend_udev",
    "dep:input",
    "dep:libseat",
    "dep:udev",
]

[dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "wayland_frontend",
    "renderer_gl",
    "desktop",
] }
calloop = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
xcursor = "0.3"
lumo-ipc = { path = "../lumo-ipc" }
lumo-foundation = { path = "../../foundation/lumo-foundation" }
# A19: wallpaper decode (jpeg+png minimo, sem default features pra evitar bloat).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }


# DRM backend optional deps (so puxados com --features drm-backend).
input = { version = "0.9", default-features = false, features = ["libinput_1_19"], optional = true }
libseat = { version = "0.2", default-features = false, optional = true }
udev = { version = "0.9", optional = true }
