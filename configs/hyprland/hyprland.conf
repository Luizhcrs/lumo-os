# Lumo OS - Hyprland config
# Mac-grade UX. Pivot 2026-05-23.

# ============================================================
# Monitor
# ============================================================
monitor=,preferred,auto,1

# ============================================================
# Autostart
# ============================================================
exec-once = waybar &
exec-once = swaync &
exec-once = hyprpaper &
# Lumo daemon multi-window cold start
exec-once = lumo-appsd &

# ============================================================
# Env
# ============================================================
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = ICED_BACKEND,tiny-skia

# ============================================================
# Input
# ============================================================
input {
    kb_layout = br
    kb_variant = abnt2
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ============================================================
# General - layout + gaps Mac-style
# ============================================================
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 0
    layout = dwindle
    resize_on_border = true
}

# ============================================================
# Decoration - round corners + blur Mac-grade
# ============================================================
decoration {
    rounding = 12
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        ignore_opacity = false
    }
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000040)
    }
    active_opacity = 1.0
    inactive_opacity = 0.97
}

# ============================================================
# Animations - Apple-grade spring curves
# ============================================================
animations {
    enabled = true
    bezier = lumo, 0.25, 0.46, 0.45, 0.94
    bezier = lumoSnap, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 4, lumoSnap, slide
    animation = windowsOut, 1, 3, lumo, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 5, lumo
    animation = workspaces, 1, 5, lumo, slidevert
}

# ============================================================
# Dwindle
# ============================================================
dwindle {
    # pseudotile removed Hyprland 0.55
    preserve_split = true
}

# ============================================================
# Misc
# ============================================================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    background_color = 0x1a1a1c
}

# ============================================================
# Window rules - Lumo apps centered
# ============================================================

# ============================================================
# Binds - Mac-style Cmd ≈ Super (Mod4)
# ============================================================
$mod = SUPER

bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exit
bind = $mod, SPACE, exec, rofi -show drun -theme ~/.config/rofi/lumo.rasi
bind = $mod, RETURN, exec, foot
bind = $mod, E, exec, lumo-appctl files
bind = $mod, T, exec, lumo-appctl editor
bind = $mod, F11, fullscreen
bind = $mod, F, togglefloating

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

# Move/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Volume/brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Screenshots
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = , Print, exec, grim ~/Pictures/screenshot-$(date +%s).png

# W34: Lumo windows (Hyprland 0.55 new syntax)
