[package]
name = "lumo-notif"
version = "0.1.0"
edition = "2021"
description = "Lumo Notif -- daemon DBus Notifications + toast overlay layer-shell."

[lib]
name = "lumo_notif"
path = "src/lib.rs"

[[bin]]
name = "lumo-notif"
path = "src/main.rs"

[dependencies]
# Cross-platform deps (lib + tests Windows).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lumo-foundation = { path = "../../crates/foundation/lumo-foundation" }

[dev-dependencies]
lumo-testkit = { path = "../../crates/testing/lumo-testkit" }

[target.'cfg(unix)'.dependencies]
# Bin Wayland/DBus deps.
smithay-client-toolkit = "0.19"
tiny-skia = "0.11"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
nix = { version = "0.30", features = ["poll"] }
lumo-error = { path = "../../crates/foundation/lumo-error" }
lumo-animation = { path = "../../crates/graphics/lumo-animation" }
