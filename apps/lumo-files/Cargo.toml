[package]
name = "lumo-files"
version = "0.1.0"
edition = "2021"
description = "Lumo Files — file manager Iced nativo para Lumo OS."

[lib]
name = "lumo_files"
path = "src/lib.rs"

[[bin]]
name = "lumo-files"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio", "image", "svg"] }
lumo-foundation = { path = "../../crates/foundation/lumo-foundation" }
lumo-error = { path = "../../crates/foundation/lumo-error" }
lumo-telemetry = { path = "../../crates/foundation/lumo-telemetry" }
trash = "5"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
mime_guess = "2"
xdg = "2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "fs", "time", "macros"] }
futures = "0.3.32"
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
resvg = "0.42"

[dev-dependencies]
tempfile = "3"
