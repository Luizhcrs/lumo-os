[package]
name = "lumo-files"
version = "0.1.0"
edition = "2021"
description = "Lumo Files — file manager Iced nativo para Lumo OS."

[[bin]]
name = "lumo-files"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio", "image", "svg"] }
lumo-foundation = { path = "../../crates/foundation/lumo-foundation" }
trash = "5"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
mime_guess = "2"
xdg = "2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "fs", "time"] }
futures = "0.3.32"

[dev-dependencies]
tempfile = "3"
