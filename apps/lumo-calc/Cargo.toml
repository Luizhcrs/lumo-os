[package]
name = "lumo-calc"
version = "0.1.0"
edition = "2021"
description = "Lumo Calc -- calculadora Iced para Lumo OS."

[lib]
name = "lumo_calc"
path = "src/lib.rs"

[[bin]]
name = "lumo-calc"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio"] }
lumo-foundation = { path = "../../crates/foundation/lumo-foundation" }
lumo-error = { path = "../../crates/foundation/lumo-error" }
meval = "0.2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"

[dev-dependencies]
