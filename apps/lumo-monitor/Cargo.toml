[package]
name = "lumo-monitor"
version = "0.1.0"
edition = "2021"
description = "Lumo Monitor -- monitor do sistema Iced para Lumo OS."

[lib]
name = "lumo_monitor"
path = "src/lib.rs"

[[bin]]
name = "lumo-monitor"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio"] }
lumo-foundation = { path = "../../crates/foundation/lumo-foundation" }
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "time"] }
futures = "0.3"
libc = "0.2"

[dev-dependencies]
