[package]
name = "lumo-editor"
version = "0.1.0"
edition = "2021"
description = "Lumo Editor -- editor de texto minimal Iced para Lumo OS."

[lib]
name = "lumo_editor"
path = "src/lib.rs"

[[bin]]
name = "lumo-editor"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio", "advanced"] }
lumo-foundation = { path = "../../crates/foundation/lumo-foundation" }
lumo-error = { path = "../../crates/foundation/lumo-error" }
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3"
