[package]
name = "lumo-osd"
version = "0.1.0"
edition = "2021"
description = "OSD daemon unico (Caps/Num/Scroll Lock + Brightness + Volume) — A4 review consolidacao."

[lib]
name = "lumo_osd"
path = "src/lib.rs"

[[bin]]
name = "lumo-osd"
path = "src/main.rs"

[dependencies]
# Cross-platform (logic puro testavel Windows).
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
lumo-foundation = { path = "../../crates/foundation/lumo-foundation" }

[dev-dependencies]
lumo-testkit = { path = "../../crates/testing/lumo-testkit" }

[target.'cfg(unix)'.dependencies]
lumo-osd-framework = { path = "../../crates/ui/lumo-osd-framework" }
lumo-error = { path = "../../crates/foundation/lumo-error" }
tiny-skia = "0.11"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smithay-client-toolkit = "0.19"
