[package]
name = "lumo-notes"
version = "0.1.0"
edition = "2021"
description = "Lumo Notes -- notas markdown Iced para Lumo OS."

[lib]
name = "lumo_notes"
path = "src/lib.rs"

[[bin]]
name = "lumo-notes"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio"] }
lumo-foundation = { path = "../../crates/foundation/lumo-foundation" }
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "time"] }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"
