[package]
name = "lumo-appsd"
version = "0.1.0"
edition = "2021"
# DEPRECATED: ver docs/adr/001-multibinary-app-canonical.md
# Migrar pra symlinks lumo-X via crate lumo-apps. Manter ate switch completo.

[[bin]]
name = "lumo-appsd"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio", "multi-window"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
lumo-about    = { path = "../lumo-about" }
lumo-calc     = { path = "../lumo-calc" }
lumo-notes    = { path = "../lumo-notes" }
lumo-monitor  = { path = "../lumo-monitor" }
lumo-editor   = { path = "../lumo-editor" }
lumo-files    = { path = "../lumo-files" }
lumo-settings = { path = "../lumo-settings" }
lumo-store    = { path = "../lumo-store" }
