[package]
name = "lumo-appsd"
version = "0.1.0"
edition = "2021"
description = "Lumo Apps daemon - Iced runtime persistente multi-window (W34)."

[[bin]]
name = "lumo-appsd"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio", "multi-window"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lumo-about = { path = "../lumo-about" }
lumo-calc  = { path = "../lumo-calc" }
