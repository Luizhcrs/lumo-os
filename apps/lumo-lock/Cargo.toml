[package]
name = "lumo-lock"
version = "0.1.0"
edition = "2021"
description = "Lumo OS lock screen — wlr-layer-shell Overlay + PAM auth"

[[bin]]
name = "lumo-lock"
path = "src/main.rs"

[dependencies]
smithay-client-toolkit = "0.19"
tiny-skia = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
nix = { version = "0.30", features = ["poll"] }
pam = { version = "0.8", optional = true }
lumo-foundation = { path = "../../crates/foundation/lumo-foundation" }
cosmic-text = "0.12"
fontdb = "0.18"

[features]
default = ["pam-auth"]
pam-auth = ["dep:pam"]
