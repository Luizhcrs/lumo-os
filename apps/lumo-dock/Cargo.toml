[package]
name = "lumo-dock"
version = "0.1.0"
edition = "2021"
description = "Lumo Dock — barra inferior layer-shell com magnify spring."

[[bin]]
name = "lumo-dock"
path = "src/main.rs"

[dependencies]
smithay-client-toolkit = "0.19"
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", features = ["parse"] }
nix = { version = "0.30", features = ["poll"] }
libc = "0.2"
lumo-foundation = { path = "../../crates/foundation/lumo-foundation" }
lumo-error = { path = "../../crates/foundation/lumo-error" }
lumo-animation = { path = "../../crates/graphics/lumo-animation" }
