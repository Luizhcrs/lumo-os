[package]
name = "lumo-bridge"
version = "0.1.0"
edition = "2021"
description = "Lumo Bridge -- HTTP daemon que expoe controle remoto do Lumo OS para agentes LLM."

[[bin]]
name = "lumo-bridge"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
bytes = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
lumo-ipc = { path = "../../crates/compositor/lumo-ipc" }
lumo-error = { path = "../../crates/foundation/lumo-error" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
