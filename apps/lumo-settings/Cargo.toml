[package]
name = "lumo-settings"
version = "0.1.0"
edition = "2021"
description = "Lumo Settings -- painel de configuracoes Iced nativo para Lumo OS."

[lib]
name = "lumo_settings"
path = "src/lib.rs"

[[bin]]
name = "lumo-settings"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio", "svg"] }
lumo-foundation = { path = "../../crates/foundation/lumo-foundation" }
lumo-sensors = { path = "../../crates/system/lumo-sensors" }
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
