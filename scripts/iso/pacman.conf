# pacman.conf -- usado pelo mkarchiso durante build ISO.
# Inclui repo Arch oficial + repo local Lumo para pacotes prebuilt.

[options]
HoldPkg         = pacman glibc
Architecture    = auto
CheckSpace
ParallelDownloads = 5

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# --- repositorios oficiais ---

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# --- repo local Lumo (pacotes prebuilt gerados em scripts/iso/pkgbuild/) ---
# Durante build ISO, mkarchiso monta este path relativo ao builddir.
# Em producao, substituir por https://pkg.lumo-os.dev/$arch/
[lumo]
SigLevel = Optional TrustAll
Server = file:///tmp/lumo-repo/$arch
