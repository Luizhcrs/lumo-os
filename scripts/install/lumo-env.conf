# Lumo OS environment variables (boot + session).
# Source-of-truth: install copia pra ~/.config/lumo/env.conf

LUMO_WM_BACKEND=drm
LUMO_THEME=dark
LUMO_TRACE_POINTER=0

# Wayland
XDG_SESSION_TYPE=wayland
XDG_CURRENT_DESKTOP=lumo
WAYLAND_DISPLAY=wayland-lumo

# AppMenu suporte (apps GTK3/Qt5 exportam menubar via DBus)
GTK_MODULES=appmenu-gtk-module
QT_QPA_PLATFORMTHEME=appmenu-qt5
UBUNTU_MENUPROXY=1

# GTK theme (W6.B)
GTK_THEME=Lumo:dark
ADW_DEBUG_COLOR_SCHEME=force-dark

# Debug
RUST_LOG=lumo_wm=warn,smithay=warn,wgpu=warn
