[Settings]
# Lumo: GTK apps (CSD) desenham a propria headerbar. Sem GNOME settings-daemon
# o GTK cai no fallback 'appmenu:close' = SO o X. Forcar layout completo
# (minimize/maximize/close a direita, igual a SSD Lumo). Copiar pra
# ~/.config/gtk-3.0/settings.ini E ~/.config/gtk-4.0/settings.ini.
gtk-decoration-layout=:minimize,maximize,close
