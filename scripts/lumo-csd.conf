# Lumo OS — politica de decoracao (env vars da sessao user).
# Install: cp scripts/lumo-csd.conf ~/.config/environment.d/
#
# REGRA (Luiz 2026-05): app que desenha a PROPRIA decoracao usa a DELE.
# O SSD do Lumo (compositor) so decora apps que NAO desenham titlebar:
# apps Lumo nativos (Iced) + terminais. GTK/Qt/Chrome/Firefox/Electron
# desenham a propria CSD -> deixar.
#
# Por isso NAO suprimimos mais CSD (antes: LD_PRELOAD gtk3-nocsd +
# GTK_CSD=0 forcavam SSD; resultado era double-titlebar/stray-X quando o
# strip falhava). O compositor decide SSD-vs-CSD por app_id
# (state::app_should_have_ssd) + xdg-decoration negotiation.
#
# Carregamento: systemd-user le environment.d/*.conf no login. Reboot
# ou re-login aplica.

# AppMenu export via D-Bus (Mousepad, Kate, Inkscape, etc). A bar Lumo
# capta + renderiza como pills. Independe de SSD vs CSD.
GTK_MODULES=appmenu-gtk-module
UBUNTU_MENUPROXY=1
QT_QPA_PLATFORMTHEME=appmenu-qt5
SAL_USE_COMMON_ONE_ACCEL=1

# NOTA: removidos (reversao da supressao de CSD):
#   LD_PRELOAD=.../libgtk3-nocsd.so.0   -> GTK desenha a propria CSD
#   GTK_CSD=0                            -> idem
#   MOZ_GTK_TITLEBAR_DECORATION=client   -> Firefox desenha a propria titlebar
