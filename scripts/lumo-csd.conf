# Lumo OS — supressao de CSD global pra todos apps spawned na sessao user.
# Install: cp scripts/lumo-csd.conf ~/.config/environment.d/
#
# Razao: Lumo compositor desenha SSD unificada (titlebar + 3 botoes
# coloridos). Apps GTK3/4/libadwaita/Chromium/Firefox ignoram
# xdg-decoration-v1 e desenham CSD propria por design. Sem essas envs:
# 2 titlebars empilhadas (SSD Lumo + CSD app) = identidade quebrada.
#
# Com essas envs aplicadas a nivel da sessao user (systemd-user),
# qualquer spawn (CLI, .desktop file, launcher, dock) herda
# automaticamente e suprime CSD.
#
# Carregamento: systemd-user le environment.d/*.conf no startup da
# sessao. Apos copiar precisa logout + login OU
# `systemctl --user daemon-reload` + restart dos services.

# GTK3: LD_PRELOAD gtk3-nocsd intercepta gtk_window_set_decorated.
# Lib em /usr/local/lib (build manual no Galaxy). NAO listar /usr/lib:
# path inexistente faz ld.so spammar "cannot be preloaded" em todo spawn
# GTK (bug boot). Adicionar outro path so se a lib existir la.
LD_PRELOAD=/usr/local/lib/libgtk3-nocsd.so.0

# GTK env vars: fallback se LD_PRELOAD nao resolver (lib ausente).
GTK_CSD=0

# AppMenu export via D-Bus (Mousepad, Kate, Inkscape, etc).
# Bar Lumo capta + renderiza como pills familia visual.
GTK_MODULES=appmenu-gtk-module
UBUNTU_MENUPROXY=1

# Mozilla Firefox: forca CSD nao desenhar titlebar propria.
MOZ_GTK_TITLEBAR_DECORATION=client

# Qt apps: usa appmenu-qt5 platform theme pra exportar dbusmenu.
QT_QPA_PLATFORMTHEME=appmenu-qt5

# Disable LibreOffice integrated menubar (uses dbusmenu fallback).
SAL_USE_COMMON_ONE_ACCEL=1

# Validacao no Galaxy Book 4 (2026-05-27):
# - Mousepad (GTK3): CSD suprimida via LD_PRELOAD ✓
# - Kate (Qt6): xdg-decoration ServerSide respeitado ✓
# - Firefox (XUL+GTK3): MOZ_GTK_TITLEBAR_DECORATION=client ✓
# - Chromium (Ozone): NAO funciona. Upstream removeu flag.
#   Workaround inexistente sem patch source. Limitacao documentada.
